name: Wriststone CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: 'ubuntu-22.04'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 'v24.14.x'

      - name: Install Dependencies
        run: npm install

      - name: Build Angular
        run: npm run build

      - name: Run Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage