<div class="log">
  <p>Please fill in this form to edit an account.</p>
  <form [formGroup]="editForm" (ngSubmit)="(onSubmit())">
    <input
      type="text"
      placeholder="Enter email"
      name="email"
      formControlName="email">
      <input
        type="text"
        placeholder="Enter fullname"
        name="fullname">
        @if (warningMessage) {
          <span>
            {{ warningMessage }}
          </span>
        }
        <button type="submit">Edit</button>
      </form>
    </div>
